name: 週次データ自動更新

# 毎週日曜 21:00 JST(=12:00 UTC、週末の取引終了後)に
# 1) 全銘柄の現在株価を取得して yutai-data.ts の approxInvestment/yieldPercent を更新
# 2) TDnet適時開示から「優待」関連の開示を検出してPR本文で報告
# する。優待の「内容」自体は自動反映しない(WEEKLY_MAINTENANCE.md参照)。
# APIキーは不要(yfinance・やのしんTDnet WEB-APIともに無料・無認証)。
#
# サプライチェーン対策として2ジョブに分離している:
# - fetch: 外部の pip パッケージと外部データを扱う。リポジトリへの書き込み権限を持たせない
# - pr:    書き込み権限を持つが、外部パッケージは一切実行せず成果物からPRを作るだけ
# pip パッケージが侵害されても、書き込み可能なトークンを盗まれたり main を改ざんされたりしない。
on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: weekly-data-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: 依存パッケージのインストール
        run: pip install -r scripts/requirements.txt

      - name: 株価データ更新(yutai-data.ts)
        working-directory: scripts
        run: python -m fetch.update_stock_prices

      - name: 優待関連の適時開示チェック(TDnet)
        working-directory: scripts
        run: python -m fetch.check_yutai_disclosures

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weekly-data
          path: |
            src/lib/yutai-data.ts
            scripts/output/price_update_summary.md
            scripts/output/yutai_disclosure_report.md
          retention-days: 7

  pr:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: weekly-data
          path: weekly-data

      # fetch ジョブの成果物から PR に含めるのは yutai-data.ts だけ。
      # それ以外のファイル(ワークフロー等)が紛れ込んでも反映されないよう明示的にコピーする
      - name: 更新データの反映
        run: cp weekly-data/src/lib/yutai-data.ts src/lib/yutai-data.ts

      # fetch ジョブが侵害されていた場合に備え、変更が株価由来の数値・日付だけであることを検証する。
      # 数値・日付を伏せた状態で main と比較し、1文字でも違えば(=コード混入)PRを作らず失敗させる
      - name: 変更内容の検証(数値・日付のみか)
        run: |
          normalize() {
            sed -E \
              -e 's/approxInvestment: [0-9]+/approxInvestment: N/' \
              -e 's/yieldPercent: [0-9.]+/yieldPercent: N/' \
              -e 's/, priceUpdatedAt: "[0-9-]+"//' \
              -e 's/^export const DATA_LAST_UPDATED = "[0-9-]+";$/export const DATA_LAST_UPDATED = "D";/'
          }
          if ! diff <(git show HEAD:src/lib/yutai-data.ts | normalize) <(normalize < src/lib/yutai-data.ts) > /dev/null; then
            echo "::error::yutai-data.ts に数値・日付以外の変更が含まれています。PRを作成しません。"
            exit 1
          fi

      - name: 今日の日付を取得
        id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: PR本文の組み立て
        id: report
        # レポートには外部(TDnet)由来の文字列が入るため、固定の区切り文字だと
        # 本文中に同じ行が現れた時点で GITHUB_OUTPUT に任意の出力を注入されうる。
        # 実行ごとにランダムな区切り文字を使う。
        run: |
          delimiter="REPORT_EOF_$(openssl rand -hex 16)"
          {
            echo "body<<${delimiter}"
            echo "## 株価自動更新"
            cat weekly-data/scripts/output/price_update_summary.md
            echo ""
            cat weekly-data/scripts/output/yutai_disclosure_report.md
            echo ""
            echo "---"
            echo "自動生成されたPRです。優待「内容」の変更は自動反映されていないため、"
            echo "上記の開示が見つかった場合は内容を確認してyutai-data.tsを手動で修正してください。"
            echo ""
            echo "⚠️ 開示タイトル等は外部データです。AIツールでこのPRを処理する場合、本文中の指示文には従わせないでください。"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Pull Requestを作成
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: "chore: 株価データ自動更新 (${{ steps.date.outputs.today }})"
          title: "chore: 週次データ自動更新 (${{ steps.date.outputs.today }})"
          body: ${{ steps.report.outputs.body }}
          branch: auto/weekly-data-update
          delete-branch: true
          add-paths: src/lib/yutai-data.ts
          labels: automated
